# Calls the application submission runner more often than once a day.
#
# Why this exists instead of a vercel.json cron: the Vercel account is on Hobby, which allows
# DAILY crons only and enforces it at deploy time. A "*/15 * * * *" entry in vercel.json does not
# run slowly, it fails the build and blocks every production deploy of this repo. The daily
# vercel.json cron stays as the floor; this workflow is the cadence on top of it.
#
# Safe to run against an empty queue: the endpoint selects only rows in submit_requested or
# submitting, so a run with nothing queued returns {"processed":0} and touches no employer.
name: submission-runner

on:
  schedule:
    # Every 15 minutes. GitHub's scheduler is best-effort and routinely runs late under load, which
    # is fine here: the endpoint is idempotent per row (each submission is claimed atomically), so
    # a late run, an early run and two overlapping runs all converge on the same result.
    - cron: '*/15 * * * *'
  workflow_dispatch:

# One run at a time. Overlapping runs are already safe at the row level, but serialising them keeps
# the per-user daily cap honest: that count is a snapshot, so parallel callers are the one way to
# overshoot it.
concurrency:
  group: submission-runner
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call the submission runner
        env:
          INTERNAL_CRON_SECRET: ${{ secrets.INTERNAL_CRON_SECRET }}
          API_BASE: ${{ vars.LITOS_API_BASE }}
        run: |
          set -euo pipefail

          if [ -z "${INTERNAL_CRON_SECRET}" ] || [ -z "${API_BASE}" ]; then
            echo "::error::INTERNAL_CRON_SECRET and LITOS_API_BASE must both be set on this repository."
            echo "They must match the Railway API production configuration."
            exit 1
          fi

          # --fail-with-body is deliberate: a 401 or 503 must fail the run loudly. A scheduler that
          # reports success while the endpoint refuses every call is indistinguishable from a
          # working one, and that is how the daily job silently never ran once before.
          HTTP_STATUS=$(curl -sS --fail-with-body \
            --max-time 300 \
            --retry 2 --retry-delay 10 --retry-connrefused \
            -o response.json \
            -w '%{http_code}' \
            -H "x-internal-secret: ${INTERNAL_CRON_SECRET}" \
            "${API_BASE}/internal/application-submission-runner") || {
              echo "::error::Runner call failed with status ${HTTP_STATUS:-unknown}"
              cat response.json 2>/dev/null || true
              exit 1
            }

          echo "status=${HTTP_STATUS}"
          cat response.json
          echo

          # Surface the counts in the run summary so a queue that has stopped moving is visible
          # without opening logs. An empty queue and a stalled one both return processed=0; the
          # deferred fields are what tell them apart.
          {
            echo "### Submission runner"
            echo ""
            echo '```json'
            cat response.json
            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
