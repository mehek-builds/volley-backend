# Adds bounded follow-up passes to the daily Vercel job-monitor cron.
#
# The endpoint stops polling after four minutes, one minute before Vercel's hard limit. If the
# source queue is larger than one bounded pass can finish, this workflow calls it again. Every pass
# selects sources by oldest last_polled_at first, so it resumes the deferred tail automatically.
name: job-monitor

on:
  schedule:
    # Ten minutes after the Vercel floor run. The two schedules are intentionally independent: the
    # application still gets one daily poll if GitHub Actions is delayed or unavailable.
    - cron: '10 6 * * *'
  workflow_dispatch:

concurrency:
  group: job-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Drain the bounded polling queue
        env:
          INTERNAL_CRON_SECRET: ${{ secrets.INTERNAL_CRON_SECRET }}
          API_BASE: ${{ vars.LITOS_API_BASE || 'https://student-outreach-backend.vercel.app' }}
        run: |
          set -euo pipefail

          if [ -z "${INTERNAL_CRON_SECRET}" ]; then
            echo "::error::INTERNAL_CRON_SECRET is not set on this repository."
            exit 1
          fi

          completed=false
          final_status=unknown
          for pass in 1 2 3; do
            response_file="response-${pass}.json"
            http_status=$(curl -sS \
              --max-time 300 \
              -o "${response_file}" \
              -w '%{http_code}' \
              -H "x-internal-secret: ${INTERNAL_CRON_SECRET}" \
              "${API_BASE}/internal/job-monitor")
            final_status="${http_status}"

            # A 500 can be the board-floor alarm after a successful polling pass. Keep draining the
            # queue in that case, then fail after the last pass so both freshness and alerting work.
            if [ "${http_status}" != 200 ] && [ "${http_status}" != 500 ]; then
              echo "::error::Job-monitor request returned HTTP ${http_status}."
              cat "${response_file}"
              exit 1
            fi

            echo "pass=${pass}"
            cat "${response_file}"
            echo

            {
              echo "### Job monitor pass ${pass}"
              echo ""
              echo '```json'
              jq '{sources, enabled_sources, deferred_sources, polling_complete, polling_elapsed_ms, surfaced_jobs, surfaced_sponsor_only_jobs, board_health, variety}' "${response_file}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            if jq -e '.polling_complete == true' "${response_file}" > /dev/null; then
              completed=true
              break
            fi
          done

          if [ "${completed}" != true ]; then
            echo "::error::Job-monitor queue still has deferred sources after three bounded passes."
            exit 1
          fi

          if [ "${final_status}" != 200 ]; then
            echo "::error::Polling completed, but the job board is below one of its inventory floors."
            exit 1
          fi
