# Manual fallback for a bounded job-monitor diagnostic.
#
# The recurring owner is the single-replica Railway worker. This workflow has no schedule so it
# cannot advance source timestamps during that worker's current-drain certification cycle.
#
# The endpoint stops starting polls after three minutes and keeps another 30 seconds for the final
# batch, leaving at least one minute before Vercel's hard limit. If the
# source queue is larger than one bounded pass can finish, this fallback calls it again. Every pass
# selects sources by oldest last_polled_at first, so it resumes the deferred tail automatically.
name: job-monitor

on:
  # Railway's single-replica worker owns the recurring drain. Keep this only as an operator-run
  # diagnostic so a second scheduler cannot advance source timestamps during certification.
  workflow_dispatch:

concurrency:
  group: job-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Drain the bounded polling queue
        env:
          INTERNAL_CRON_SECRET: ${{ secrets.INTERNAL_CRON_SECRET }}
          API_BASE: ${{ vars.LITOS_API_BASE }}
        run: |
          set -euo pipefail

          if [ -z "${INTERNAL_CRON_SECRET}" ] || [ -z "${API_BASE}" ]; then
            echo "::error::INTERNAL_CRON_SECRET and LITOS_API_BASE must both be set on this repository."
            exit 1
          fi

          completed=false
          final_status=unknown
          total_failed=0
          drain_started_at=""
          for pass in 1 2 3 4 5; do
            response_file="response-${pass}.json"
            http_status=409
            for lock_attempt in $(seq 1 20); do
              monitor_url="${API_BASE}/internal/job-monitor"
              if [ -n "${drain_started_at}" ]; then
                monitor_url="${monitor_url}?drain_started_at=${drain_started_at}"
              fi
              http_status=$(curl -sS \
                --max-time 300 \
                -o "${response_file}" \
                -w '%{http_code}' \
                -H "x-internal-secret: ${INTERNAL_CRON_SECRET}" \
                "${monitor_url}")
              if [ "${http_status}" != 409 ]; then
                break
              fi
              if [ "${lock_attempt}" -lt 20 ]; then
                echo "Another monitor run holds the polling lock; retrying in 15 seconds (${lock_attempt}/20)."
                sleep 15
              fi
            done
            final_status="${http_status}"
            if [ -z "${drain_started_at}" ]; then
              drain_started_at=$(jq -r '.drain_started_at // empty' "${response_file}")
            fi

            # A 500 can be the structured board-floor alarm after a successful polling pass. Keep
            # draining only that response. A timeout or unexpected server error has no monitor
            # payload and must fail immediately instead of repeating expensive polling five times.
            structured_monitor_response=false
            if jq -e '
              (.polling_complete | type) == "boolean"
              and (.drain_started_at | type) == "string"
              and (.results | type) == "array"
              and (.minimum_surfaced_jobs | type) == "number"
            ' "${response_file}" > /dev/null 2>&1; then
              structured_monitor_response=true
            fi
            if [ "${http_status}" != 200 ] && {
              [ "${http_status}" != 500 ] || [ "${structured_monitor_response}" != true ];
            }; then
              echo "::error::Job-monitor request returned HTTP ${http_status}."
              cat "${response_file}"
              exit 1
            fi

            echo "pass=${pass}"
            cat "${response_file}"
            echo
            pass_failed=$(jq -r '.failed // 0' "${response_file}")
            total_failed=$((total_failed + pass_failed))

            {
              echo "### Job monitor pass ${pass}"
              echo ""
              echo '```json'
              jq '{sources, enabled_sources, selected_sources, deferred_sources, polling_complete, poll_segment_size, drain_started_at, polling_elapsed_ms, failed, failed_sources: [.results[] | select(.ok == false) | {company, error}], surfaced_postings, surfaced_grouped_roles, surfaced_sponsor_only_jobs, certified_unique_jobs, certified_unique_grouped_roles, certified_unique_sponsor_jobs, certification_started_at, grouped_role_alert_threshold, grouped_role_alert_triggered, target_surfaced_postings, target_surfaced_grouped_roles, inventory_target_met, board_health, variety, classification_coverage, target_role_coverage}' "${response_file}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            if jq -e '.grouped_role_alert_triggered == true' "${response_file}" > /dev/null; then
              grouped_roles=$(jq -r '.surfaced_grouped_roles' "${response_file}")
              threshold=$(jq -r '.grouped_role_alert_threshold' "${response_file}")
              echo "::warning::Grouped roles are ${grouped_roles}, below the ${threshold} early-alert threshold."
            fi
            if jq -e '.classification_coverage.all_coverage_thresholds_met == false' "${response_file}" > /dev/null; then
              echo "::warning::Job-family or industry coverage is below its configured threshold."
            fi
            if jq -e '.target_role_coverage.measurement_available == false' "${response_file}" > /dev/null; then
              echo "::warning::User target-role coverage could not be measured within its database budget."
            elif jq -e '.target_role_coverage.coverage_threshold_met == false' "${response_file}" > /dev/null; then
              zero_roles=$(jq -r '.target_role_coverage.zero_result_target_roles' "${response_file}")
              echo "::warning::${zero_roles} distinct user-entered target roles currently return zero jobs."
            fi

            if jq -e '.polling_complete == true' "${response_file}" > /dev/null; then
              completed=true
              break
            fi
          done

          if [ "${completed}" != true ]; then
            echo "::error::Job-monitor queue still has deferred sources after five bounded passes."
            exit 1
          fi

          if [ "${final_status}" != 200 ]; then
            echo "::error::Polling completed, but the job board is below one of its inventory floors."
            exit 1
          fi

          if [ "${total_failed}" -gt 0 ]; then
            echo "::error::${total_failed} source polls failed across the completed monitor passes."
            exit 1
          fi
