name: Standardized test scores migration

# workflow_dispatch only, and only from main, exactly like the country work eligibility migration
# beside it. The migration is a deliberate human act against the production schema: nothing here
# runs on push, so merging this branch cannot migrate anything by itself.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.SCHEMA_CHECK_DATABASE_URL }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Require production schema connection
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "SCHEMA_CHECK_DATABASE_URL is required." >&2
            exit 2
          fi

      - name: Install locked dependencies
        run: npm ci

      - name: Apply standardized test score columns and the coursework list
        run: npm run db:standardized-test-scores
