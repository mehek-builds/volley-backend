name: Standardized test scores migration

# workflow_dispatch only: the migration is a deliberate human act against the production schema, and
# nothing here runs on push, so merging this branch cannot migrate anything by itself.
#
# NO `if: github.ref == 'refs/heads/main'` GATE, and that is the one difference from the country
# work eligibility workflow beside it. That gate makes migration-first IMPOSSIBLE for a migration
# whose script is added by the same PR: the script does not exist on main until the merge, so the
# only order the gate permits is merge then migrate, which is exactly the order that takes the
# backend down. Dispatch this workflow against the FEATURE BRANCH first, confirm the columns are
# present, then merge.
#
# Dropping the gate is safe here because the job is dispatch-only and the script is idempotent,
# transactional, and additive: it runs `add column if not exists` and re-reads information_schema to
# verify nullability rather than trusting the DDL. Running it from a branch cannot do anything to
# production that running it from main would not.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.SCHEMA_CHECK_DATABASE_URL }}
    steps:
      - name: Check out the dispatched ref
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Require production schema connection
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "SCHEMA_CHECK_DATABASE_URL is required." >&2
            exit 2
          fi

      - name: Install locked dependencies
        run: npm ci

      - name: Apply standardized test score columns
        run: npm run db:standardized-test-scores
