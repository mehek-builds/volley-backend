name: CI

on:
  pull_request:
  push:
    branches: [main]
  # DAILY, and deliberately not hourly. This workflow runs four jobs, and GitHub bills Actions by
  # the JOB rounded up to the whole minute, so one run costs ~7 billed minutes rather than the ~4
  # it spends. At hourly that is ~170 minutes a day from the schedule alone, against the 2,000
  # minutes a month a private repo gets on the Free plan. On 2026-08-04 the allowance ran out and
  # every job on every branch, including main, started failing in two seconds with no runner
  # assigned and no logs to read. Nothing in the repo could explain it, because a job that never
  # starts leaves nothing behind.
  #
  # 07:17 UTC because the board poll is 06:00 UTC (vercel.json). The scheduled run exists to catch
  # drift in the LIVE board and schema, so it has to read a board the poll has already refreshed;
  # running before it would measure yesterday and call it today.
  schedule:
    - cron: '17 7 * * *'

# Least privilege: this job only needs to read the code (S1).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build and load production modules
        run: npm run build:smoke
      # `node --test` exits 0 when the glob matches nothing, so a moved/renamed test
      # would go green with zero tests run. Fail loudly if no test files exist (B2).
      - name: Ensure test files exist
        run: test -n "$(find src -name '*.test.ts' -print -quit)"
      # `api/` holds ONLY request handlers. Vercel builds every file under it into its own
      # deployed serverless function, so a test or helper left there becomes a publicly routable
      # endpoint: `vercel build` on 2026-08-04 emitted `functions/api/index.test.func` from a
      # test file that had been placed there. Entrypoint logic lives in src/ and is tested there;
      # this keeps the directory from silently growing endpoints again.
      # Matches ANY file, not just tests: a plain `api/helpers.ts` becomes a deployed public
      # endpoint just as readily as a test file does. index.ts is the only handler this app has.
      - name: api/ contains only request handlers
        run: |
          UNEXPECTED=$(find api -type f ! -name 'index.ts')
          if [ -n "$UNEXPECTED" ]; then
            echo "::error title=Unexpected file in api/::Vercel builds every file under api/ into its own deployed function. Move non-handler code to src/. Found:"
            echo "$UNEXPECTED"
            exit 1
          fi
      - name: Test
        run: npm test

  # Catches the one failure mode schema-push has that nothing else sees: a branch runs db:push
  # before it merges, prod ends up holding a column `main` does not declare, and the NEXT branch's
  # push drops it. On 2026-07-17 prod carried 8 undeclared columns, one holding real data, while
  # every test was green and typecheck was clean. See scripts/check-schema-drift.mjs.
  #
  # Separate job, not a step in `test`: this one needs a database and `test` deliberately does not,
  # so a missing/rotated secret must never be able to take the test suite down with it.
  schema-drift:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Skips rather than fails when the secret is absent, so a fork or a checkout without database
      # access is not blocked by a check it cannot possibly run. The skip is LOUD: a silent skip
      # would leave a green tick meaning "not checked", which is how this class of bug survives.
      - name: Check schema drift against the database
        env:
          DATABASE_URL: ${{ secrets.SCHEMA_CHECK_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning title=Schema drift NOT checked::SCHEMA_CHECK_DATABASE_URL is not set, so this PR was not compared against the database. Set the secret to enable the guard."
            exit 0
          fi
          npm run schema:check

  # The employer logo on a job row breaks WITHOUT FAILING: no exception, no red test, just a column
  # of empty circles. It has happened twice (see scripts/check-logo-coverage.mjs). Nothing in the
  # repo can see it, because the map stays internally consistent while the board grows past it —
  # only a measurement against the live board can. Same idea as schema-drift, different drift.
  logo-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check company-logo coverage against the live board
        run: npm run logo:check

  # DOES EVERY BOARD BELONG TO THE COMPANY WE CALL IT?
  #
  # A job source is three hand-written strings, and the only gate that ever ran on a new one asked
  # "does this token return postings?" - a question every wrong token also answers yes to. Four
  # boards therefore sat on the live list under a name that was not theirs: `sas` is Superior Alarm
  # Systems, `bcg` is Bohen Consulting Group, `tcs` is Thornbury Community Services, `disney` is a
  # board called "Sgt. Pepper's Lonely Hearts Club Band". Each was found by hand, weeks apart, by
  # somebody chasing a different bug.
  #
  # Greenhouse publishes `company_name` on every posting, so the right answer was available on every
  # poll in between. This asks for it, on every source, at pull-request time. Like logo-coverage it
  # measures against the LIVE boards, because that is the only place the truth is.
  source-identity:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check every job source against the company its portal names
        run: npm run sources:verify
