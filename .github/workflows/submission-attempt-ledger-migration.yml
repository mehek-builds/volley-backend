name: Submission authority migrations

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      API_BASE: ${{ vars.LITOS_API_BASE || 'https://student-outreach-backend.vercel.app' }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Require production schema connection
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.SCHEMA_CHECK_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "SCHEMA_CHECK_DATABASE_URL is required." >&2
            exit 2
          fi

      - name: Install locked dependencies
        run: npm ci

      - name: Prove both additive migration contracts locally
        run: |
          npm run test:submission-attempt-ledger-migration
          npm run test:submission-authority-revision-migration

      - name: Require the exact frozen backend revision
        shell: bash
        run: |
          set -euo pipefail
          health_file=$(mktemp)
          status=$(curl --silent --show-error --max-time 30 \
            --output "$health_file" --write-out '%{http_code}' \
            "${API_BASE%/}/health")
          if [ "$status" != "200" ] && [ "$status" != "503" ]; then
            echo "Backend health returned HTTP $status instead of 200 or dependency-degraded 503." >&2
            exit 3
          fi
          jq --exit-status --arg revision "$GITHUB_SHA" '
            .revision == $revision
            and .submission_cutover.mode == "freeze"
            and .submission_cutover.config_valid == true
          ' "$health_file" >/dev/null || {
            jq '{revision, revision_source, build, submission_cutover}' "$health_file" >&2
            echo "The exact workflow revision must be serving in valid freeze mode before migration." >&2
            exit 4
          }
          jq '{revision, revision_source, build, submission_cutover}' "$health_file"

      - name: Prove issuer and worker fences are active
        shell: bash
        run: |
          set -euo pipefail
          probe_frozen() {
            method="$1"
            path="$2"
            response_file=$(mktemp)
            headers_file=$(mktemp)
            if [ "$method" = "POST" ]; then
              status=$(curl --silent --show-error --max-time 30 \
                --request POST --header 'content-type: application/json' --data '{}' \
                --dump-header "$headers_file" --output "$response_file" --write-out '%{http_code}' \
                "${API_BASE%/}${path}")
            else
              status=$(curl --silent --show-error --max-time 30 \
                --request GET --dump-header "$headers_file" \
                --output "$response_file" --write-out '%{http_code}' \
                "${API_BASE%/}${path}")
            fi
            test "$status" = "503"
            jq --exit-status '.code == "SUBMISSION_CUTOVER_FROZEN"' "$response_file" >/dev/null
            grep -Eiq '^cache-control:.*no-store' "$headers_file"
            grep -Eiq '^retry-after:[[:space:]]*[0-9]+' "$headers_file"
          }
          probe_frozen POST /applications/00000000-0000-4000-8000-000000000000/submit-request
          probe_frozen GET /internal/application-submission-runner

      - name: Drain every old backend instance
        shell: bash
        run: |
          echo "Freeze is live. Waiting 310 seconds so every old 300-second backend invocation exits."
          sleep 310

      - name: Recheck the same frozen revision after the drain
        shell: bash
        run: |
          set -euo pipefail
          health_file=$(mktemp)
          status=$(curl --silent --show-error --max-time 30 \
            --output "$health_file" --write-out '%{http_code}' \
            "${API_BASE%/}/health")
          if [ "$status" != "200" ] && [ "$status" != "503" ]; then
            echo "Backend health returned HTTP $status after the drain." >&2
            exit 5
          fi
          jq --exit-status --arg revision "$GITHUB_SHA" '
            .revision == $revision
            and .submission_cutover.mode == "freeze"
            and .submission_cutover.config_valid == true
          ' "$health_file" >/dev/null || {
            jq '{revision, revision_source, build, submission_cutover}' "$health_file" >&2
            echo "The frozen revision changed or the fence opened during the drain." >&2
            exit 6
          }

      - name: Apply and verify production submission attempt ledger
        env:
          DATABASE_URL: ${{ secrets.SCHEMA_CHECK_DATABASE_URL }}
        run: npm run db:submission-attempt-ledger

      - name: Apply and verify production submission authority revision
        env:
          DATABASE_URL: ${{ secrets.SCHEMA_CHECK_DATABASE_URL }}
        run: npm run db:submission-authority-revision

      - name: Require freeze remained active through migration
        shell: bash
        run: |
          set -euo pipefail
          health_file=$(mktemp)
          status=$(curl --silent --show-error --max-time 30 \
            --output "$health_file" --write-out '%{http_code}' \
            "${API_BASE%/}/health")
          if [ "$status" != "200" ] && [ "$status" != "503" ]; then
            echo "Backend health returned HTTP $status after migration." >&2
            exit 7
          fi
          jq --exit-status --arg revision "$GITHUB_SHA" '
            .revision == $revision
            and .submission_cutover.mode == "freeze"
            and .submission_cutover.config_valid == true
            and .submission_authority.ready == true
            and .submission_authority.attempt_ledger.ready == true
            and .submission_authority.revision.ready == true
          ' "$health_file" >/dev/null || {
            jq '{revision, revision_source, build, submission_cutover, submission_authority}' "$health_file" >&2
            echo "The exact frozen revision, fence, or submission authority readiness changed during migration." >&2
            exit 8
          }

      - name: Record frozen migration evidence
        if: success()
        shell: bash
        run: |
          {
            echo "## Submission authority schemas ready"
            echo
            echo "The immutable attempt ledger was applied before the authority revision schema, and both catalog contracts were verified while the exact backend revision remained frozen."
            echo
            echo "Commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
