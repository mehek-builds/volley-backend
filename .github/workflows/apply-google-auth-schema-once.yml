name: Apply Google Auth Schema Once

on:
  push:
    branches: [codex/google-sign-in]

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply Google auth schema
        env:
          DATABASE_URL: ${{ secrets.SCHEMA_CHECK_DATABASE_URL }}
        run: npm run db:google-auth
